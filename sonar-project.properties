sonar.projectKey=CodeCraftsmanRaj_SprintSmith
sonar.organization=codecraftsmanraj
sonar.projectName=SprintSmith

sonar.sources=backend-core/backend/app,backend-core/ai-engine/app,frontend/src
sonar.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,frontend/.output/**,**/migrations/**,frontend/.tanstack/**,frontend/src/test/**
sonar.tests=frontend/src/test
sonar.test.inclusions=frontend/src/test/**/*.test.ts,frontend/src/test/**/*.test.tsx,frontend/src/test/**/*.spec.ts,frontend/src/test/**/*.spec.tsx
sonar.python.version=3.12

# Backend coverage produced by the SonarCloud workflow (pytest --cov). Paths in
# the report are repo-relative so they map onto sonar.sources above.
sonar.python.coverage.reportPaths=backend-core/backend/coverage.xml,backend-core/ai-engine/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
