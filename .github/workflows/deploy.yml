name: Production Deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test-ci:
    name: CI tests
    uses: ./.github/workflows/ci.yml

  test-full-stack:
    name: Full-stack integration tests
    uses: ./.github/workflows/full-stack.yml

  test-backend-core:
    name: Backend-core tests
    uses: ./.github/workflows/backend-core.yml

  test-ai-engine:
    name: AI-engine tests
    uses: ./.github/workflows/ai-engine-core.yml

  deploy-backend:
    name: Build and deploy backend to GCP
    if: github.ref == 'refs/heads/main'
    needs:
      - test-ci
      - test-full-stack
      - test-backend-core
      - test-ai-engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/833405754913/locations/global/workloadIdentityPools/sprintsmith-github/providers/github
          service_account: sprintsmith-github-deploy@major-project-512815.iam.gserviceaccount.com
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: major-project-512815
      - name: Build and deploy backend
        run: bash infra/deploy/deploy-gcp.sh

  deploy-frontend:
    name: Deploy frontend to Cloudflare Workers
    # Frontend and backend are independent deployments. Run the frontend even
    # when the backend job fails, but only after every test suite passes.
    if: >-
      ${{
        !cancelled() &&
        github.ref == 'refs/heads/main' &&
        vars.DEPLOY_FRONTEND == 'true' &&
        needs.test-ci.result == 'success' &&
        needs.test-full-stack.result == 'success' &&
        needs.test-backend-core.result == 'success' &&
        needs.test-ai-engine.result == 'success'
      }}
    needs:
      - test-ci
      - test-full-stack
      - test-backend-core
      - test-ai-engine
      - deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_URL: ${{ vars.API_URL || 'https://sprintsmith-api.rajmathuria.me' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Cloudflare credentials
        run: |
          status=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            status=1
          elif ! [[ "${CLOUDFLARE_API_TOKEN}" =~ ^[A-Za-z0-9_-]{40,64}$ ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is malformed (expected 40-64 letters/digits/_/- with no whitespace). Environment secrets override repository secrets; check Settings > Environments > production."
            status=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings > Secrets and variables > Actions."
            status=1
          elif ! [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is malformed (expected 32 lowercase hex characters)."
            status=1
          fi
          exit "$status"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Deploy Cloudflare Worker
        working-directory: frontend
        env:
          # GitHub runners can have transient connectivity issues with the
          # Cloudflare API; retry before failing the job.
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          for attempt in 1 2 3; do
            if npx --yes wrangler@4 deploy; then
              exit 0
            fi
            echo "wrangler deploy failed (attempt ${attempt}/3)"
            sleep 15
          done
          exit 1
