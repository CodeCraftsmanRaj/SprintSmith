name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/devansh-12

jobs:
  publish-backend:
    name: Publish backend images
    if: vars.BACKEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta-backend
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/sprintsmith-backend-core
          tags: |
            type=raw,value=main
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: backend-core/backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
      - uses: docker/metadata-action@v5
        id: meta-ai
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/sprintsmith-ai-engine
          tags: |
            type=raw,value=main
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: backend-core/ai-engine
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}

  deploy-backend:
    name: Deploy backend VM
    if: vars.BACKEND_DEPLOY_ENABLED == 'true'
    needs: publish-backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USER }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          source: "infra/deploy/compose.production.yaml"
          target: "/opt/sprintsmith"
      - name: Restart backend stack
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USER }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_NAMESPACE,GHCR_READ_USER,GHCR_READ_TOKEN
          script: |
            cd /opt/sprintsmith
            mkdir -p infra/deploy
            mv -f compose.production.yaml infra/deploy/compose.production.yaml
            test -f infra/deploy/compose.production.yaml
            sed -i "s#^BACKEND_IMAGE=.*#BACKEND_IMAGE=${IMAGE_NAMESPACE}/sprintsmith-backend-core:${IMAGE_TAG}#" .env
            sed -i "s#^AI_ENGINE_IMAGE=.*#AI_ENGINE_IMAGE=${IMAGE_NAMESPACE}/sprintsmith-ai-engine:${IMAGE_TAG}#" .env
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_READ_USER" --password-stdin
            docker compose --env-file .env -f infra/deploy/compose.production.yaml pull
            docker compose --env-file .env -f infra/deploy/compose.production.yaml up -d
            curl --fail --retry 10 --retry-delay 5 http://localhost:8002/health

  deploy-frontend:
    name: Deploy frontend to Cloudflare
    if: vars.DEPLOY_FRONTEND == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: npm run build
      - name: Deploy Cloudflare Worker
        working-directory: frontend
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}