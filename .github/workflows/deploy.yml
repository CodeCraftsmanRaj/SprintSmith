name: Production Deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Build and deploy backend to GCP
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/833405754913/locations/global/workloadIdentityPools/sprintsmith-github/providers/github
          service_account: sprintsmith-github-deploy@major-project-512815.iam.gserviceaccount.com
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: major-project-512815
      - name: Build and deploy backend
        run: bash infra/deploy/deploy-gcp.sh

  deploy-frontend:
    name: Deploy frontend to Cloudflare Workers
    # Frontend and backend are independent deployments. Run the frontend even
    # when the backend job fails, but not when the whole workflow is cancelled.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.DEPLOY_FRONTEND == 'true' }}
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_URL: ${{ vars.API_URL || 'https://sprintsmith-api.rajmathuria.me' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Cloudflare credentials
        run: |
          status=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            status=1
          elif ! [[ "${CLOUDFLARE_API_TOKEN}" =~ ^[A-Za-z0-9_-]{40,64}$ ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is malformed (expected 40-64 letters/digits/_/- with no whitespace). Environment secrets override repository secrets; check Settings > Environments > production."
            status=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings > Secrets and variables > Actions."
            status=1
          elif ! [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is malformed (expected 32 lowercase hex characters)."
            status=1
          fi
          exit "$status"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Diagnose Cloudflare API access
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          echo "--- wrangler whoami ---"
          npx --yes wrangler@4 whoami || echo "whoami failed"
          echo "--- direct API probe (read-only, workers scripts list) ---"
          code=$(curl -sS -o /tmp/cf-probe.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || echo "curl-failed")
          echo "HTTP ${code}"
          head -c 600 /tmp/cf-probe.json 2>/dev/null || true
          echo
      - name: Deploy Cloudflare Worker
        working-directory: frontend
        env:
          # GitHub runners advertise a broken IPv6 route; Node's fetch can pick
          # it and fail with "fetch failed". Prefer IPv4 for the Cloudflare API.
          NODE_OPTIONS: --dns-result-order=ipv4first
          WRANGLER_LOG: debug
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npx --yes wrangler@4 deploy 2>&1 | sed -E 's/[A-Za-z0-9_-]{40,}/<REDACTED>/g'; then
              exit 0
            fi
            echo "wrangler deploy failed (attempt ${attempt}/3)"
            sleep 15
          done
          exit 1
