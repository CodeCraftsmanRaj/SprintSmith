name: SprintSmith AI Engine

on:
  push:
    branches: ["**", "!main"]
  pull_request:
    paths:
      - "backend-core/ai-engine/**"
      - ".github/workflows/ai-engine-core.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend-core/ai-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-core/ai-engine/requirements-dev.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
          key: ai-engine-models-${{ hashFiles('backend-core/ai-engine/requirements.txt') }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ./run_tests.sh coverage --junitxml=junit-ai.xml --cov-report=xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sprintsmith-ai-engine-test-reports
          path: |
            backend-core/ai-engine/junit-ai.xml
            backend-core/ai-engine/coverage.xml
            backend-core/ai-engine/var/coverage_html
          if-no-files-found: warn