name: SonarCloud

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud quality gate
    # Skipped until SONAR_ENABLED=true is set, so the pipeline stays green
    # before the SonarCloud project and token exist.
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Make frontend coverage paths repo-relative
        run: |
          python - <<'PY'
          from pathlib import Path

          report = Path("frontend/coverage/lcov.info")
          lines = report.read_text().splitlines()
          normalized = []
          for line in lines:
              if line.startswith("SF:"):
                  source = line[3:].replace("\\", "/")
                  if not source.startswith(("frontend/", "/")):
                      source = f"frontend/{source}"
                  line = f"SF:{source}"
              normalized.append(line)
          report.write_text("\n".join(normalized) + "\n")
          print("rewrote frontend LCOV source paths relative to the repository root")
          PY
      - name: Verify frontend LCOV report
        run: test -s frontend/coverage/lcov.info
      # Generate a fresh backend coverage report for SonarCloud. The backend
      # suite runs on SQLite in-memory with the AI engine stubbed, so it needs
      # no external services. Run from the repo root so the paths recorded in
      # coverage.xml are repo-relative and map onto sonar.sources.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-core/backend/requirements-dev.txt
      - name: Install backend test dependencies
        working-directory: backend-core/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run backend tests with coverage
        env:
          PYTHONPATH: backend-core/backend
        run: |
          python -m pytest backend-core/backend/tests/ -q \
            --cov=backend-core/backend/app \
            --cov-report=xml:backend-core/backend/coverage.xml
      # coverage.py writes filenames relative to the --cov source root (e.g.
      # "main.py", "api/deps.py"). Rewrite them to be repo-relative so SonarCloud
      # maps each file onto sonar.sources. Point <source> at the repo root and
      # prefix every filename with the app root.
      - name: Make coverage paths repo-relative
        run: |
          python - <<'PY'
          import re
          path = "backend-core/backend/coverage.xml"
          prefix = "backend-core/backend/app"
          xml = open(path).read()
          xml = re.sub(r"<source>.*?</source>", "<source>.</source>", xml, count=1, flags=re.S)
          xml = re.sub(r'filename="', f'filename="{prefix}/', xml)
          open(path, "w").write(xml)
          print("rewrote coverage paths to be repo-relative")
          PY
      # Generate a fresh ai-engine coverage report for SonarCloud so new ai-engine
      # lines count toward coverage (without it new_coverage reads 0.0).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-core/ai-engine/requirements-dev.txt
      - name: Install ai-engine test dependencies
        working-directory: backend-core/ai-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run ai-engine tests with coverage
        working-directory: backend-core/ai-engine
        run: |
          ./run_tests.sh coverage --cov-report=xml
      # coverage.py writes filenames relative to the --cov source root (e.g.
      # "main.py", "api/deps.py"). Rewrite them to be repo-relative so SonarCloud
      # maps each file onto sonar.sources.
      - name: Make ai-engine coverage paths repo-relative
        run: |
          python - <<'PY'
          import re
          path = "backend-core/ai-engine/coverage.xml"
          prefix = "backend-core/ai-engine/app"
          xml = open(path).read()
          xml = re.sub(r"<source>.*?</source>", "<source>.</source>", xml, count=1, flags=re.S)
          xml = re.sub(r'filename="', f'filename="{prefix}/', xml)
          open(path, "w").write(xml)
          print("rewrote ai-engine coverage paths to be repo-relative")
          PY
      # SonarSource has reported intermittent 403 responses from the scanner
      # binary CDN on GitHub-hosted runners. Retry once so a transient download
      # denial does not fail an otherwise valid analysis.
      - name: SonarQube Scan (attempt 1)
        id: sonar_scan_attempt_1
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Retry SonarQube Scan
        if: steps.sonar_scan_attempt_1.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
