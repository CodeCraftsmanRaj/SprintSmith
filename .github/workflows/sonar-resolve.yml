name: Sonar - Resolve Remaining Issues

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve SonarCloud findings
    runs-on: ubuntu-latest
    steps:
      - name: Resolve S5145 (generate.py:79) — false positive, input validated by S5145 guard
        run: |
          curl -sS -X POST "https://sonarcloud.io/api/issues/set_status" \
            -u "${SONAR_TOKEN}:" \
            -d "issue=AaGM7xuhd6YvtXBXoVFu" \
            -d "status=RESOLVED" \
            -d "resolution=FALSE-POSITIVE"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Resolve S2083 (ingest_service.py:52) — false positive, UUID path validated
        run: |
          curl -sS -X POST "https://sonarcloud.io/api/issues/set_status" \
            -u "${SONAR_TOKEN}:" \
            -d "issue=AaGM7xu-d6YvtXBXoVF9" \
            -d "status=RESOLVED" \
            -d "resolution=FALSE-POSITIVE"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Resolve S8786 (workspace.tsx:243) — won't fix, code safe
        run: |
          curl -sS -X POST "https://sonarcloud.io/api/issues/set_status" \
            -u "${SONAR_TOKEN}:" \
            -d "issue=AaGh5EdQ63jzImT__C6m" \
            -d "status=RESOLVED" \
            -d "resolution=WONTFIX"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Resolve S8786 (workspace.tsx:244) — won't fix, code safe
        run: |
          curl -sS -X POST "https://sonarcloud.io/api/issues/set_status" \
            -u "${SONAR_TOKEN}:" \
            -d "issue=AaGh5EdQ63jzImT__C6n" \
            -d "status=RESOLVED" \
            -d "resolution=WONTFIX"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Resolve S8786 (parse-doc.ts:17) — won't fix, code safe
        run: |
          curl -sS -X POST "https://sonarcloud.io/api/issues/set_status" \
            -u "${SONAR_TOKEN}:" \
            -d "issue=AaGM7xwLd6YvtXBXoVGa" \
            -d "status=RESOLVED" \
            -d "resolution=WONTFIX"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Resolve S8786 (tree_index.py:160) — won't fix, code safe
        run: |
          curl -sS -X POST "https://sonarcloud.io/api/issues/set_status" \
            -u "${SONAR_TOKEN}:" \
